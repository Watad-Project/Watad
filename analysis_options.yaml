# Static analysis rules for Watad. CI runs `flutter analyze --fatal-infos`, so every
# info-level lint below also fails the build. Architecture rules that a linter cannot
# express are enforced by `dart run tool/check_architecture.dart`
# (see AGENTS.md and docs/APP_ARCHITECTURE.md).
#
# Do not disable a rule here to make a change pass. Changing this file needs a
# maintainer's approval: Ameer or Omar Mulla (AGENTS.md).
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
    todo: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Consistency
    - always_use_package_imports
    - avoid_relative_lib_imports
    - directives_ordering
    - prefer_single_quotes
    - sort_pub_dependencies

    # Safety
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - unawaited_futures
    - use_build_context_synchronously

    # Clarity
    - always_declare_return_types
    - prefer_final_fields
    - prefer_final_locals
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - require_trailing_commas
    - unnecessary_lambdas
    - use_super_parameters
