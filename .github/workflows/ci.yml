name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Keep this equal to docs/APP_PACKAGES.md §1 and the environment block
      # of pubspec.yaml. Changing it needs a maintainer.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      # flutter_dotenv bundles .env as an asset, so the build needs the file.
      # CI uses the placeholders; real values never reach the repository.
      - name: Create .env from the template
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Architecture rules
        run: dart run tool/check_architecture.dart
